[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pysesame-ble"
version = "0.1.0"
description = "Python library for controlling Candy House Sesame smart locks and accessories over Bluetooth Low Energy (BLE)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Alastair D'Silva", email = "alastair@d-silva.org" },
]
maintainers = [
    { name = "Alastair D'Silva", email = "alastair@d-silva.org" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.5.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/InfernoEmbedded/pysesame-ble"
Repository = "https://github.com/InfernoEmbedded/pysesame-ble"
"Bug Tracker" = "https://github.com/InfernoEmbedded/pysesame-ble/issues"

[tool.poetry]
packages = [{ include = "pysesame_ble", from = "src" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = []
